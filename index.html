'use strict';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const now=()=>new Date().toISOString();const textFromHtml=h=>{let d=document.createElement('div');d.innerHTML=h;return d.textContent||''};const wordCount=s=>(s.trim().match(/\S+/g)||[]).length;const duration=s=>Math.max(1,Math.ceil(wordCount(s)/130*60));const fmt=s=>`${Math.floor(s/60)} min ${String(s%60).padStart(2,'0')} s`;const date=s=>s?new Date(s).toLocaleDateString('fr-FR'):'—';const types=['Actualité du collège','Reportage','Interview','Chronique culturelle','Chronique sportive','Météo','Actualité internationale','Portrait','Annonce','Éditorial'];const statuses=['Brouillon','En rédaction','À relire','Corrections demandées','Validé','Prêt à diffuser','Archivé'];const instructions={'Actualité du collège':'Qui ? Quoi ? Où ? Quand ? Pourquoi ? Raconte les faits les plus importants en premier.','Reportage':'Décris le lieu, les personnes et les faits observés. Ajoute des témoignages sourcés.','Interview':'Prépare des questions ouvertes et distingue les paroles de l’invité de tes commentaires.','Chronique culturelle':'Présente l’œuvre, son auteur et les raisons de ton choix, en distinguant faits et avis.','Chronique sportive':'Présente le contexte, le résultat vérifié et les protagonistes.','Météo':'Précise la date, la zone géographique et la source des prévisions.','Actualité internationale':'Situe les événements et vérifie plusieurs sources indépendantes.','Portrait':'Présente la personne avec son accord et des informations vérifiées.','Annonce':'Précise le public, le lieu, la date et les modalités.','Éditorial':'Exprime clairement ton point de vue en le distinguant des faits.'};let db,articles=[],shows=[],settings={},editing=null,showEditing=null,selectedScript='',selectedTitle='';let page='home',saveTimer;
function toast(s){let t=$('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),3200)}function openDB(){return new Promise((res,rej)=>{let r=indexedDB.open('webtv-studio-v1',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('articles',{keyPath:'id'});d.createObjectStore('shows',{keyPath:'id'});d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(store){return new Promise((res,rej)=>{let r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(store,obj){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).put(obj);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(store,id){return new Promise((res,rej)=>{let r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function refresh(){articles=await all('articles');shows=await all('shows');let s=await all('settings');settings=Object.fromEntries(s.map(x=>[x.key,x.value]))}function changePage(p){page=p;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===p));render()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>changePage(b.dataset.page));const titles={home:['Bienvenue au studio !','Votre rédaction scolaire, du premier mot au direct.'],editor:['Atelier de rédaction','Écris, améliore et prépare ton article pour l’oral.'],articles:['Mes articles','Retrouve toutes les productions de ton appareil.'],collective:['Rédaction commune','Rassemble les articles provenant de plusieurs appareils.'],shows:['Émissions','Compose ton journal télévisé et son conducteur.'],prompter:['Super prompteur','Répète et présente ton journal devant la caméra.'],teacher:['Espace professeur','Relis, commente et valide les productions locales.'],backups:['Sauvegardes','Pr function newArticle(){editing={id:uid(),title:'',subtitle:'',author:'',type:types[0],chapo:'',body:'',sources:'',status:'Brouillon',created:now(),updated:now(),comments:'',checklist:{},versions:[]};changePage('editor')}function editArticle(id){editing=structuredClone(articles.find(a=>a.id===id));changePage('editor')}function editor(c){if(!editing){editing={id:uid(),title:'',subtitle:'',author:'',type:types[0],chapo:'',body:'',sources:'',status:'Brouillon',created:now(),updated:now(),comments:'',checklist:{},versions:[]}}let a=editing;c.innerHTML=`<div class="toolbar"><button class="btn" id="save-article">💾 Enregistrer</button><button class="btn secondary" id="export-article">⬇ Exporter JSON</button><button class="btn secondary" id="to-prompter">📺 Ouvrir au prompteur</button><span class="muted tiny" id="autosave-status">Sauvegarde automatique activée</span></div><div class="editor"><div class="card"><div class="field"><label>Titre de l'article</label><input id="a-title" value="${esc(a.title)}" placeholder="Ex. Le club robotique fait parler de lui"></div><div class="field"><label>Sous-titre</label><input id="a-subtitle" value="${esc(a.subtitle)}"></div><div class="grid" style="margin:0"><div class="field"><label>Auteur ou équipe</label><input id="a-author" value="${esc(a.author)}"></div><div class="field"><label>Rubrique</label><select id="a-type">${types.map(x=>`<option ${a.type===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div></div><div class="field"><label>Chapô : l'essentiel en quelques lignes</label><textarea id="a-chapo">${esc(a.chapo)}</textarea></div><div class="field"><label>Corps de l'article</label><div class="toolbar"><button class="btn secondary" data-format="bold"><b>G</b></button><button class="btn secondary" data-format="italic"><i>I</i></button><button class="btn secondary" data-format="underline"><u>S</u></button><button class="btn secondary" data-format="insertUnorderedList">☷ Liste</button><button class="btn secondary" data-format="undo">↶</button><button class="btn secondary" data-format="redo">↷</button></div><div id="a-body" class="editarea" contenteditable="true" role="textbox" aria-label="Texte de l'article" aria-multiline="true">${a.body}</div></div><div class="field"><label>Sources et références (une par ligne)</label><textarea id="a-sources" placeholder="Titre, auteur, date, lien...">${esc(a.sources)}</textarea></div><div class="row"><span id="counter" class="muted"></span><span class="chip" id="duration"></span></div></div><aside><div class="card"><h3>💡 Coach journaliste</h3><div class="field"><label>Accompagnement</label><select id="coach-mode"><option>Guidé</option><option>Autonome</option></select></div><div id="coach" class="hint"></div><button class="btn secondary" id="check-article">🔎 Analyser mon texte</button><div id="feedback"></div></div><div class="card" style="margin-top:15px"><h3>🎤 Pour l'oral</h3><p class="muted tiny">Privilégie les phrases courtes et les transitions. Le prompteur utilise une version texte sans mise en forme.</p><button class="btn secondary" id="oral-preview">👁 Aperçu oral</button></div></aside></div>`;const get=()=>{editing.title=$('#a-title').value;editing.subtitle=$('#a-subtitle').value;editing.author=$('#a-author').value;editing.type=$('#a-type').value;editing.chapo=$('#a-chapo').value;editing.body=cleanHtml($('#a-body').innerHTML);editing.sources=$('#a-sources').value;editing.updated=now();return editing};const update=()=>{let a=get(),txt=a.chapo+' '+textFromHtml(a.body);$('#counter').textContent=wordCount(txt)+' mots';$('#duration').textContent=fmt(duration(txt));$('#coach').textContent=$('#coach-mode').value==='Guidé'?instructions[a.type]:'Relis ton texte : les informations sont-elles claires, sourcées et faciles à dire ?';$('#autosave-status').textContent='Modifications en cours…';clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{await persistArticle(get(),false);$('#autosave-status')&&($('#autosave-status').textContent='✓ Sauvegardé')},800)};c.querySelectorAll('input,textarea,select,#a-body').forEach(el=>el.addEventListener('input',update));c.querySelectorAll('[data-format]').forEach(b=>b.onclick=()=>{document.execCommand(b.dataset.format,false,null);$('#a-body').focus();update()});$('#save-article').onclick=async()=>{await persistArticle(get(),true);toast('Article enregistré')};$('#export-article').onclick=()=>{download('article-'+slug(get().title||'sans-titre')+'.json',{format:'webtv-article',version:1,article:get()})};$('#to-prompter').onclick=()=>{let a=get();selectedScript=articleScript(a);selectedTitle=a.title||'Article';changePage('prompter');launchTele()};$('#oral-preview').onclick=()=>{let a=get();alert(articleScript(a))};$('#check-article').onclick=()=>{let a=get(),t=textFromHtml(a.body),checks=[['Titre présent',!!a.title.trim()],['Auteur indiqué',!!a.author.trim()],['Chapô rédigé',!!a.chapo.trim()],['Sources indiquées',!!a.sources.trim()],['Texte de 50 mots minimum',wordCount(t)>=50],['Phrases courtes (moyenne ≤ 25 mots)',wordCount(t)/(t.split(/[.!?]+/).filter(x=>x.trim()).length||1)<=25]];$('#feedback').innerHTML=checks.map(([x,ok])=>`<div class="hint">${ok?'✅':'⚠️'} ${x}</div>`).join('')+'<p class="tiny muted">Cette grille ne vérifie pas la véracité des informations.</p>'};update();$('#autosave-status').textContent='✓ Sauvegarde automatique'}function cleanHtml(html){let doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,iframe,object,embed,svg,math,form').forEach(n=>n.remove());doc.querySelectorAll('*').forEach(el=>{for(let at of [...el.attributes])el.removeAttribute(at.name);if(!['B','I','U','STRONG','EM','P','DIV','BR','UL','OL','LI','H2','H3'].includes(el.tagName))el.replaceWith(...el.childNodes)});return doc.body.innerHTML}async function persistArticle(a,version){let old=articles.find(x=>x.id===a.id);let copy=structuredClone(a);if(version&&old&&old.body!==a.body){copy.versions=[...(old.versions||[]),{at:old.updated,title:old.title,body:old.body}].slice(-15)}await put('articles',copy);articles=await all('articles')}
function articleScript(a){return [a.title,a.chapo,textFromHtml(a.body)].filter(Boolean).join('\n\n')}function download(name,data){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),el=document.createElement('a');el.href=url;el.download=name;el.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function slug(s){return (s||'webtv').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,50)}function articlePage(c){let active=articles.filter(a=>!a.deleted);c.innerHTML=`<div class="toolbar"><button class="btn" onclick="newArticle()">＋ Nouvel article</button><input id="search" placeholder="Rechercher un article…" aria-label="Rechercher"><select id="filter"><option value="">Tous les statuts</option>${statuses.map(s=>`<option>${s}</option>`).join('')}</select><button class="btn secondary" onclick="showTrash()">🗑 Corbeille</button></div><div class="article-list" id="article-list"></div>`;function paint(){let q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#article-list').innerHTML=active.filter(a=>(a.title+' '+a.author).toLowerCase().includes(q)&&(!f||a.status===f)).sort((a,b)=>b.updated.localeCompare(a.updated)).map(a=>`<div class="card"><div class="row"><span class="chip">${esc(a.type)}</span><span class="chip">${esc(a.status)}</span></div><h3>${esc(a.title||'Sans titre')}</h3><div class="muted tiny">${esc(a.author||'Auteur non indiqué')} · ${date(a.updated)} · ${fmt(duration(articleScript(a)))}</div><p class="muted">${esc((a.chapo||textFromHtml(a.body)).slice(0,130))}</p><div class="actions"><button class="btn" onclick="editArticle('${a.id}')">Modifier</button><button class="btn secondary" onclick="playArticle('${a.id}')">📺</button><button class="btn secondary" onclick="duplicateArticle('${a.id}')">Dupliquer</button><button class="btn secondary" onclick="exportArticle('${a.id}')">JSON</button><button class="btn danger" onclick="trashArticle('${a.id}')">🗑</button></div></div>`).join('')||'<p class="muted">Aucun article. Crée ton premier reportage !</p>'}$('#search').oninput=paint;$('#filter').onchange=paint;paint()}function exportArticle(id){let a=articles.find(x=>x.id===id);download('article-'+slug(a.title)+'.json',{format:'webtv-article',version:1,article:a})}function playArticle(id){let a=articles.find(x=>x.id===id);selectedScript=articleScript(a);selectedTitle=a.title;launchTele()}async function duplicateArticle(id){let a=structuredClone(articles.find(x=>x.id===id));a.id=uid();a.title+=' (copie)';a.created=a.updated=now();a.versions=[];await persistArticle(a,false);render()}async function trashArticle(id){if(!confirm('Placer cet article dans la corbeille ?'))return;let a=articles.find(x=>x.id===id);a.deleted=true;a.updated=now();await put('articles',a);await refresh();render()}function showTrash(){let a=articles.filter(x=>x.deleted);if(!a.length)return toast('La corbeille est vide');let ids=a.map(x=>x.title).join('\n');if(confirm('Articles dans la corbeille :\n'+ids+'\n\nRestaurer tous ces articles ?'))Promise.all(a.map(x=>{x.deleted=false;return put('articles',x)})).then(async()=>{await refresh();render()})}
function collective(c){c.innerHTML=`<div class="hero"><div><h2>Une rédaction, plusieurs journalistes.</h2><p>Chaque élève exporte son article. Le professeur importe les fichiers et les retrouve dans la bibliothèque commune de cet appareil.</p><button class="btn yellow" id="import-many">📥 Importer des articles JSON</button></div><div class="emoji">👥📰</div></div><div class="grid"><div class="card"><h3>1. Rédiger</h3><p class="muted">Chaque élève travaille sur son ordinateur ou sa tablette.</p></div><div class="card"><h3>2. Exporter</h3><p class="muted">Un fichier JSON transporte l'article et ses métadonnées.</p></div><div class="card"><h3>3. Regrouper</h3><p class="muted">Import multiple, détection des doublons et validation.</p></div></div><div class="card"><h3>📦 Articles de la rédaction locale</h3><p>${articles.filter(x=>!x.deleted).length} article(s) disponible(s).</p><button class="btn secondary" id="export-many">Exporter tous les articles</button></div><div class="notice warning">La rédaction commune en temps réel entre appareils nécessite Firebase et n'est pas activée dans cette version autonome.</div>`;$('#import-many').onclick=()=>chooseImport();$('#export-many').onclick=()=>download('webtv-articles.json',{format:'webtv-articles',version:1,articles:articles.filter(x=>!x.deleted)})}function chooseImport(){let f=$('#file-input');f.value='';f.click()}$('#file-input').onchange=async e=>{let files=[...e.target.files],added=0,skipped=0,replaced=0,errors=[];for(let f of files){try{let obj=JSON.parse(await f.text());let arr=obj.format==='webtv-article'?[obj.article]:obj.format==='webtv-articles'?obj.articles:obj.format==='webtv-backup'?obj.articles:null;if(!Array.isArray(arr))throw Error('Format non reconnu');for(let raw of arr){if(!raw||typeof raw.id!=='string'||typeof raw.title!=='string'||typeof raw.body!=='string'||typeof raw.chapo!=='string'||!raw.id||raw.id.length>200)throw Error('Article invalide');let a={...raw,body:cleanHtml(raw.body),versions:Array.isArray(raw.versions)?raw.versions.slice(-15):[],updated:raw.updated||now()};let old=articles.find(x=>x.id===a.id);if(old){let choice=prompt(`Doublon : ${a.title}\nTape R pour remplacer, C pour conserver les deux, ou I pour ignorer.`,'I');if(choice?.toUpperCase()==='R'){await put('articles',a);replaced++}else if(choice?.toUpperCase()==='C'){a.id=uid();await put('articles',a);added++}else skipped++}else{await put('articles',a);added++}await refresh()}}catch(err){errors.push(f.name+': '+err.message)}}toast(`Import : ${added} ajout(s), ${replaced} remplacé(s), ${skipped} ignoré(s). ${errors.length} erreur(s).`);if(errors.length)alert(errors.join('\n'));render()};
function newShow(){showEditing={id:uid(),title:'Journal du collège',number:'1',theme:'',date:new Date().toISOString().slice(0,10),team:'',target:300,segments:[],created:now(),updated:now()};changePage('shows')}function editShow(id){showEditing=structuredClone(shows.find(s=>s.id===id));changePage('shows')}function showPage(c){if(!showEditing){c.innerHTML=`<div class="toolbar"><button class="btn" onclick="newShow()">＋ Nouvelle émission</button></div><div class="article-list">${shows.map(s=>`<div class="card"><h3>🎬 ${esc(s.title)}</h3><p class="muted">${date(s.date)} · ${s.segments.length} séquences</p><div class="actions"><button class="btn" onclick="editShow('${s.id}')">Ouvrir</button><button class="btn secondary" onclick="playShow('${s.id}')">▶ Lancer</button></div></div>`).join('')||'<div class="card">Aucune émission pour le moment.</div>'}</div>`;return}let s=showEditing;c.innerHTML=`<div class="toolbar"><button class="btn" id="save-show">💾 Enregistrer</button><button class="btn pink" id="play-show">▶ LANCER L'ÉMISSION</button><button class="btn secondary" id="export-show">⬇ Exporter JSON</button><button class="btn secondary" id="back-shows">← Toutes les émissions</button></div><div class="card"><div class="grid"><div class="field"><label>Nom de l'émission</label><input id="s-title" value="${esc(s.title)}"></div><div class="field"><label>Numéro</label><input id="s-number" value="${esc(s.number)}"></div><div class="field"><label>Date</label><input id="s-date" type="date" value="${esc(s.date)}"></div><div class="field"><label>Thème</label><input id="s-theme" value="${esc(s.theme)}"></div><div class="field"><label>Équipe</label><input id="s-team" value="${esc(s.team)}"></div><div class="field"><label>Durée cible (secondes)</label><input id="s-target" type="number" min="1" value="${s.target}"></div></div></div><div class="section"><h2>🎞 Conducteur <span id="show-duration" class="chip"></span></h2><div class="toolbar"><select id="segment-type"><option>Introduction</option><option>Article</option><option>Interview</option><option>Reportage</option><option>Chronique</option><option>Transition</option><option>Pause</option><option>Conclusion</option><option>Générique</option></select><button class="btn" id="add-segment">＋ Ajouter une séquence</button><select id="article-to-add"><option value="">Choisir un article validé…</option>${articles.filter(a=>!a.deleted&&['Validé','Prêt à diffuser'].includes(a.status)).map(a=>`<option value="${a.id}">${esc(a.title)}</option>`).join('')}</select><button class="btn secondary" id="add-article">Ajouter l'article</button></div><div id="segments"></div></div>`;function collect(){s.title=$('#s-title').value;s.number=$('#s-number').value;s.date=$('#s-date').value;s.theme=$('#s-theme').value;s.team=$('#s-team').value;s.target=Number($('#s-target').value)||300;s.updated=now()}async function save(){collect();await put('shows',structuredClone(s));shows=await all('shows')}function paint(){let secs=s.segments.reduce((n,x)=>n+(x.duration||duration(x.text||'')),0);$('#show-duration').textContent=fmt(secs)+' / cible '+fmt(s.target);$('#segments').innerHTML=s.segments.map((seg,i)=>`<div class="seq" draggable="true" data-index="${i}"><div class="row"><strong>☰ ${i+1}. ${esc(seg.type)}</strong><span class="chip">${fmt(seg.duration||duration(seg.text||''))}</span></div><div class="grid"><div class="field"><label>Titre</label><input data-i="${i}" data-k="title" value="${esc(seg.title)}"></div><div class="field"><label>Présentateur</label><input data-i="${i}" data-k="presenter" value="${esc(seg.presenter)}"></div></div><div class="field"><label>Texte lu à l'antenne</label><textarea data-i="${i}" data-k="text">${esc(seg.text)}</textarea></div><div class="field"><label>Notes de régie</label><input data-i="${i}" data-k="notes" value="${esc(seg.notes||'')}"></div><div class="actions"><button class="btn secondary" data-move="up" data-i="${i}">↑</button><button class="btn secondary" data-move="down" data-i="${i}">↓</button><button class="btn danger" data-move="delete" data-i="${i}">Supprimer</button></div></div>`).join('')||'<p class="muted">Ajoute des séquences ou un article validé.</p>';$('#segments').querySelectorAll('[data-k]').forEach(el=>el.oninput=()=>{s.segments[+el.dataset.i][el.dataset.k]=el.value;let sec=s.segments[+el.dataset.i];sec.duration=duration(sec.text);$('#show-duration').textContent=fmt(s.segments.reduce((n,x)=>n+(x.duration||0),0))+' / cible '+fmt(s.target)});$('#segments').querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{let i=+el.dataset.i,dir=el.dataset.move;if(dir==='delete'){s.segments.splice(i,1)}else{let j=i+(dir==='up'?-1:1);if(j<0||j>=s.segments.length)return;[s.segments[i],s.segments[j]]=[s.segments[j],s.segments[i]]}paint()});let dragging=null;$('#segments').querySelectorAll('.seq').forEach(el=>{el.ondragstart=()=>dragging=+el.dataset.index;el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let to=+el.dataset.index;if(dragging===null||dragging===to)return;let seg=s.segments.splice(dragging,1)[0];s.segments.splice(to,0,seg);dragging=null;paint()}})}$('#add-segment').onclick=()=>{let type=$('#segment-type').value;s.segments.push({id:uid(),type,title:type,presenter:'',text:'',notes:'',duration:0});paint()};$('#add-article').onclick=()=>{let a=articles.find(x=>x.id===$('#article-to-add').value);if(!a)return toast('Choisis un article validé');s.segments.push({id:uid(),type:'Article',title:a.title,presenter:a.author,text:articleScript(a),notes:'',duration:duration(articleScript(a)),articleId:a.id});paint()};$('#save-show').onclick=async()=>{await save();toast('Émission enregistrée')};$('#play-show').onclick=async()=>{await save();selectedScript=showScript(s);selectedTitle=s.title;launchTele()};$('#export-show').onclick=()=>{collect();download('emission-'+slug(s.title)+'.json',{format:'webtv-show',version:1,show:s})};$('#back-shows').onclick=()=>{showEditing=null;render()};paint()}function showScript(s){return s.segments.map(x=>[x.presenter?'PRÉSENTATEUR : '+x.presenter:'',x.title?x.title.toUpperCase():'',x.text].filter(Boolean).join('\n\n')).join('\n\n────────────\n\n')}function playShow(id){let s=shows.find(x=>x.id===id);selectedScript=showScript(s);selectedTitle=s.title;launchTele()}
function teacher(c){let active=articles.filter(a=>!a.deleted);c.innerHTML=`<div class="notice warning">Mode local : la validation est un outil de travail, pas une authentification du professeur. Les droits sécurisés exigent le mode Firebase.</div><div class="grid"><div class="card"><div class="muted">À relire</div><div class="stat">${active.filter(a=>a.status==='À relire').length}</div></div><div class="card"><div class="muted">Corrections demandées</div><div class="stat">${active.filter(a=>a.status==='Corrections demandées').length}</div></div><div class="card"><div class="muted">Validés</div><div class="stat">${active.filter(a=>['Validé','Prêt à diffuser'].includes(a.status)).length}</div></div></div><div class="article-list">${active.map(a=>`<div class="card"><h3>${esc(a.title||'Sans titre')}</h3><p class="muted tiny">${esc(a.author)} · ${esc(a.status)}</p><div class="field"><label>Statut</label><select data-status="${a.id}">${statuses.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label>Commentaires du professeur</label><textarea data-comment="${a.id}">${esc(a.comments||'')}</textarea></div><button class="btn" data-save-review="${a.id}">Enregistrer la relecture</button><button class="btn secondary" onclick="editArticle('${a.id}')">Lire et modifier</button></div>`).join('')}</div>`;c.querySelectorAll('[data-save-review]').forEach(b=>b.onclick=async()=>{let a=articles.find(x=>x.id===b.dataset.saveReview);a.status=c.querySelector(`[data-status="${a.id}"]`).value;a.comments=c.querySelector(`[data-comment="${a.id}"]`).value;a.updated=now();await put('articles',a);await refresh();toast('Relecture enregistrée')})}
function prompterPage(c){c.innerHTML=`<div class="hero"><div><span class="pill">📺 PROMPTEUR PRO</span><h2>Prêt à passer à l'antenne ?</h2><p>Texte géant, défilement fluide, mode tactile, miroir, plein écran et régie.</p><button class="btn yellow" id="launch">▶ Lancer le prompteur</button></div><div class="emoji">📺</div></div><div class="card section"><h3>Choisir le script</h3><div class="field"><label>Article ou émission</label><select id="script-select"><option value="demo">Exemple de présentation</option>${articles.filter(x=>!x.deleted).map(a=>`<option value="a:${a.id}">Article : ${esc(a.title||'Sans titre')}</option>`).join('')}${shows.map(s=>`<option value="s:${s.id}">Émission : ${esc(s.title)}</option>`).join('')}</select></div><div class="field"><label>Ou écrire/coller directement le texte</label><textarea id="custom-script" style="min-height:170px" placeholder="Ton texte à lire…">${esc(selectedScript)}</textarea></div></div><div class="notice">Conseil : place la tablette en paysage juste sous l'objectif. Sur mini-PC, la touche Espace permet de mettre en pause.</div>`;$('#script-select').onchange=()=>{let v=$('#script-select').value;if(v==='demo')$('#custom-script').value=demoScript();else if(v.startsWith('a:'))$('#custom-script').value=articleScript(articles.find(x=>x.id===v.slice(2)));else $('#custom-script').value=showScript(shows.find(x=>x.id===v.slice(2)))};$('#launch').onclick=()=>{selectedScript=$('#custom-script').value||demoScript();selectedTitle='Prompteur';launchTele()}}function demoScript(){return 'Bonjour à toutes et à tous !\n\nBienvenue dans le journal du collège.\n\nAujourd’hui, nous allons découvrir le club robotique.\n\nChaque semaine, les élèves imaginent, construisent et programment leurs propres robots.\n\nPlace à notre reportage !'}
let tele=null;function launchTele(){if(tele)closeTele();let root=$('#tele-root');document.body.classList.add('tele-open');root.innerHTML=`<div class="tele" id="tele"><div class="telebar" id="telebar"><span>🔴 ON AIR · <span id="tele-title"></span></span><div class="actions"><button id="tele-start" class="go">▶ Lecture</button><button id="tele-back">↶ Début</button><button id="tele-count">⏱ 3 s</button><button id="tele-full">⛶ Plein écran</button><button id="tele-exit">✕ Fermer</button></div><span id="tele-time">00:00</span></div><div class="teleview" id="teleview"><div class="guide" id="teleguide"></div><div class="scroll" id="telescroll"></div></div><div class="settings" id="telesettings"><label>Vitesse <input id="tele-speed" type="range" min="5" max="140" value="40"><span id="speed-label">40 px/s</span></label><label>Taille <input id="tele-font" type="range" min="24" max="100" value="48"><span id="font-label">48 px</span></label><label>Interligne <input id="tele-line" type="range" min="12" max="24" value="16"></label><label>Marges <input id="tele-margin" type="range" min="2" max="30" value="12"></label><label><input type="checkbox" id="tele-mirror"> Miroir</label><label><input type="checkbox" id="tele-guide" checked> Repère</label><label>Police <select id="tele-family"><option>Arial</option><option>Verdana</option><option>Georgia</option></select></label><label>Texte <input type="color" id="tele-color" value="#ffffff"></label><button id="tele-hide">Masquer réglages</button></div></div>`;let sc=$('#telescroll');sc.innerHTML=(selectedScript||demoScript()).split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join('');$('#tele-title').textContent=selectedTitle||'Répétition';tele={running:false,pos:0,last:0,elapsed:0,speed:40,raf:null,counting:false};let apply=()=>{sc.style.transform=`translateY(${-tele.pos}px)`};let step=t=>{if(!tele)return;if(tele.running){if(tele.last){let dt=Math.min((t-tele.last)/1000,.1);tele.pos+=tele.speed*dt;tele.elapsed+=dt}tele.last=t;apply();$('#tele-time').textContent=fmt(Math.floor(tele.elapsed));if(tele.pos>sc.scrollHeight-$('#teleview').clientHeight*.55){tele.running=false;$('#tele-start').textContent='▶ Lecture'}}else tele.last=0;tele.raf=requestAnimationFrame(step)};tele.raf=requestAnimationFrame(step);$('#tele-start').onclick=()=>{tele.running=!tele.running;tele.last=0;$('#tele-start').textContent=tele.running?'⏸ Pause':'▶ Lecture'};$('#tele-back').onclick=()=>{tele.pos=0;tele.elapsed=0;apply()};$('#tele-count').onclick=()=>{tele.running=false;let n=3,div=document.createElement('div');div.className='countdown';div.textContent=n;$('#teleview').appendChild(div);let timer=setInterval(()=>{n--;if(n>0)div.textContent=n;else{clearInterval(timer);div.remove();if(tele){tele.running=true;tele.last=0;$('#tele-start').textContent='⏸ Pause'}}},1000);tele.countTimer=timer};$('#tele-full').onclick=()=>{let e=$('#tele');if(document.fullscreenElement)document.exitFullscreen();else e.requestFullscreen?.().catch(()=>toast('Plein écran indisponible sur cet appareil'))};$('#tele-exit').onclick=closeTele;$('#tele-speed').oninput=e=>{tele.speed=+e.target.value;$('#speed-label').textContent=tele.speed+' px/s'};$('#tele-font').oninput=e=>{let old=sc.scrollHeight;sc.style.setProperty('--tele-font',e.target.value+'px');tele.pos=tele.pos*(sc.scrollHeight/Math.max(1,old));$('#font-label').textContent=e.target.value+' px'};$('#tele-line').oninput=e=>sc.style.setProperty('--tele-line',(+e.target.value/10).toString());$('#tele-margin').oninput=e=>sc.style.setProperty('--tele-margin',e.target.value+'%');$('#tele-mirror').onchange=e=>{ /* Flip glyphs without flipping scroll direction */sc.style.scale=e.target.checked?'-1 1':'1 1'};$('#tele-guide').onchange=e=>$('#teleguide').classList.toggle('hidden',!e.target.checked);$('#tele-family').onchange=e=>sc.style.setProperty('--tele-family',e.target.value);$('#tele-color').oninput=e=>sc.style.setProperty('--tele-color',e.target.value);$('#tele-hide').onclick=()=>{$('#telesettings').classList.toggle('hidden');$('#telebar').classList.toggle('hidden')};let touch=null;$('#teleview').addEventListener('touchstart',e=>{touch=e.touches[0].clientY},{passive:true});$('#teleview').addEventListener('touchmove',e=>{if(touch===null)return;tele.running=false;tele.pos=Math.max(0,tele.pos+(touch-e.touches[0].clientY));touch=e.touches[0].clientY;apply()},{passive:true});$('#teleview').addEventListener('wheel',e=>{tele.running=false;tele.pos=Math.max(0,tele.pos+e.deltaY);apply()},{passive:true});$('#teleview').addEventListener('dblclick',()=>$('#tele-start').click());window.addEventListener('keydown',teleKeys)}function teleKeys(e){if(!tele)return;if(['Space','ArrowUp','ArrowDown','PageUp','PageDown','Home','KeyF','Escape'].includes(e.code))e.preventDefault();if(e.code==='Space')$('#tele-start').click();if(e.code==='ArrowUp'){$('#tele-speed').value=Math.min(140,tele.speed+5);$('#tele-speed').oninput({target:$('#tele-speed')})}if(e.code==='ArrowDown'){$('#tele-speed').value=Math.max(5,tele.speed-5);$('#tele-speed').oninput({target:$('#tele-speed')})}if(e.code==='PageDown')tele.pos+=160;if(e.code==='PageUp')tele.pos=Math.max(0,tele.pos-160);if(e.code==='Home')$('#tele-back').click();if(e.code==='KeyF')$('#tele-full').click();if(e.code==='Escape'&&!document.fullscreenElement)closeTele()}function closeTele(){if(!tele)return;cancelAnimationFrame(tele.raf);clearInterval(tele.countTimer);tele=null;window.removeEventListener('keydown',teleKeys);if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('#tele-root').innerHTML='';document.body.classList.remove('tele-open')}
function backups(c){c.innerHTML=`<div class="grid"><div class="card"><h3>💾 Sauvegarder tout mon studio</h3><p class="muted">Articles, émissions et paramètres dans un fichier JSON portable.</p><button class="btn" id="export-backup">⬇ Exporter la sauvegarde</button></div><div class="card"><h3>📥 Restaurer les articles</h3><p class="muted">Importer des fichiers JSON sans écraser silencieusement les articles.</p><button class="btn secondary" id="import-backup">Importer JSON</button></div></div><div class="notice warning">Les données locales sont propres à ce navigateur. Effectue régulièrement une sauvegarde JSON, notamment avant de vider le cache ou de changer d'appareil.</div>`;$('#export-backup').onclick=()=>download('webtv-studio-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',{format:'webtv-backup',version:1,exported:now(),articles,shows,settings});$('#import-backup').onclick=()=>chooseImport()}
function help(c){c.innerHTML=`<div class="grid"><div class="card helptext"><h3>📰 Bien écrire un article</h3><p>Commence par les faits essentiels : qui, quoi, où, quand, pourquoi et comment. Vérifie tes sources. Distingue clairement les faits des opinions. Pour la télévision, écris des phrases courtes et naturelles.</p></div><div class="card helptext"><h3>🎙️ Devant la caméra</h3><p>Place la tablette en paysage juste sous l'objectif. Lis à voix haute avant l'enregistrement. Ajuste la vitesse à ton rythme et marque des pauses. Ne parle pas trop vite.</p></div><div class="card helptext"><h3>🔎 Vérifier les sources</h3><p>Note l'auteur, la date et l'origine des informations. Recoupe les affirmations importantes. Une information publiée en ligne n'est pas automatiquement vraie.</p></div><div class="card helptext"><h3>🔐 Droit à l'image</h3><p>Avant de filmer ou de diffuser, vérifie les autorisations applicables dans l'établissement, en particulier pour les élèves mineurs. N'utilise pas d'images, de musiques ou de vidéos sans disposer des droits nécessaires.</p></div></div><div class="card"><h3>📱 Mode tablette / mini-PC</h3><p>Sur mini-PC : Espace = lecture/pause, flèches = vitesse, Page haut/bas = navigation, F = plein écran, Home = début. Sur tablette : glisse verticalement pour avancer ou reculer.</p><p class="muted">Le mode local n'impose aucun compte. Les données restent sur l'appareil, sauf export manuel.</p></div>`}
(async()=>{try{db=await openDB();await refresh();render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})}catch(e){$('#content').innerHTML='<div class="notice warning">Le stockage local n’est pas disponible dans ce navigateur. Vérifie que le site est ouvert en HTTPS et que les données ne sont pas bloquées.</div>';console.error(e)}})();
